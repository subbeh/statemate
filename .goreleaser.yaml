version: 2

project_name: statemate

before:
  hooks:
    - go mod tidy

builds:
  - id: mate
    binary: mate
    main: ./cmd/mate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE*
      - README*

checksum:
  name_template: "checksums.txt"

# Release notes come from CHANGELOG.md, passed via --release-notes by the release
# workflow. Generating them from commit subjects both leaked implementation detail
# and dropped whole categories: the exclude filters below would have hidden the
# entire documentation rewrite in 0.3.0 because its commit was prefixed "docs:".
changelog:
  disable: true

release:
  github:
    owner: subbeh
    name: statemate
  prerelease: auto
  name_template: "{{.ProjectName}} v{{.Version}}"

brews:
  - repository:
      owner: subbeh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/subbeh/statemate"
    description: "Declarative system configuration management"
    license: "MIT"
    install: |
      bin.install "mate"
    test: |
      system "#{bin}/mate", "--version"

aurs:
  - name: statemate-bin
    homepage: "https://github.com/subbeh/statemate"
    description: "Declarative system configuration management"
    license: "MIT"
    maintainers:
      - "Steven Terwindt <git@sbbh.cloud>"
    contributors:
      - "Steven Terwindt <git@sbbh.cloud>"
    private_key: "{{ .Env.AUR_SSH_KEY }}"
    git_url: "ssh://aur@aur.archlinux.org/statemate-bin.git"
    provides:
      - statemate
    conflicts:
      - statemate
    package: |-
      install -Dm755 mate "${pkgdir}/usr/bin/mate"
      install -Dm644 LICENSE "${pkgdir}/usr/share/licenses/statemate/LICENSE"
